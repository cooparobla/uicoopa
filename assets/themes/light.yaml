# uicoopa default theme — light.
#
# Mirrors UITheme::builtin_light() field-for-field (see uicoopa/builder/ui_theme.h):
# light panels, dark text, the same accent/status hues as dark.yaml so the two
# read as siblings. Every field is optional -- omit a key to fall back to
# UITheme::builtin_dark()'s value for it (load_theme_file() starts from
# builtin_dark(), not builtin_light(), so an incomplete light.yaml would mix
# in dark defaults for anything left unspecified; this file spells out every
# field for that reason).
name: light

panel:
  background: { r: 0.94, g: 0.95, b: 0.96, a: 1.00 }
  panel:      { r: 0.99, g: 0.99, b: 1.00, a: 0.98 }
  panel_alt:  { r: 0.96, g: 0.96, b: 0.98, a: 0.98 }
  header_bar: { r: 0.88, g: 0.90, b: 0.94, a: 1.00 }
  border:     { r: 0.80, g: 0.82, b: 0.86, a: 1.00 }

text:
  primary:   { r: 0.10, g: 0.11, b: 0.14, a: 1.0 }
  secondary: { r: 0.35, g: 0.38, b: 0.44, a: 1.0 }
  muted:     { r: 0.50, g: 0.53, b: 0.58, a: 1.0 }
  accent:    { r: 0.10, g: 0.40, b: 0.85, a: 1.0 }
  success:   { r: 0.10, g: 0.55, b: 0.30, a: 1.0 }
  warning:   { r: 0.70, g: 0.48, b: 0.05, a: 1.0 }
  info:      { r: 0.15, g: 0.45, b: 0.75, a: 1.0 }
  size_title: 18.0
  size_label: 14.0
  size_small: 11.0
  font_path: assets/fonts/DejaVuSans.ttf

button:
  normal:   { r: 0.88, g: 0.89, b: 0.92, a: 1.0 }
  hover:    { r: 0.80, g: 0.82, b: 0.87, a: 1.0 }
  press:    { r: 0.72, g: 0.74, b: 0.80, a: 1.0 }
  disabled: { r: 0.90, g: 0.90, b: 0.92, a: 0.5 }

button_primary:
  normal:   { r: 0.20, g: 0.55, b: 0.85, a: 1.0 }
  hover:    { r: 0.28, g: 0.65, b: 0.95, a: 1.0 }
  press:    { r: 0.16, g: 0.45, b: 0.72, a: 1.0 }
  disabled: { r: 0.60, g: 0.72, b: 0.85, a: 0.5 }

button_success:
  normal:   { r: 0.22, g: 0.55, b: 0.38, a: 1.0 }
  hover:    { r: 0.28, g: 0.65, b: 0.46, a: 1.0 }
  press:    { r: 0.18, g: 0.45, b: 0.30, a: 1.0 }
  disabled: { r: 0.60, g: 0.78, b: 0.68, a: 0.5 }

slider:
  track:           { r: 0.85, g: 0.86, b: 0.89, a: 1.0 }
  fill:            { r: 0.20, g: 0.55, b: 0.85, a: 1.0 }
  handle:          { r: 0.20, g: 0.22, b: 0.26, a: 1.0 }
  handle_hover:    { r: 0.10, g: 0.11, b: 0.14, a: 1.0 }
  handle_press:    { r: 0.30, g: 0.32, b: 0.36, a: 1.0 }
  handle_disabled: { r: 0.20, g: 0.22, b: 0.26, a: 0.4 }
  height: 18.0
  handle_width: 14.0

toggle:
  bg:          { r: 0.85, g: 0.86, b: 0.89, a: 1.0 }
  bg_hover:    { r: 0.78, g: 0.80, b: 0.84, a: 1.0 }
  bg_press:    { r: 0.70, g: 0.72, b: 0.77, a: 1.0 }
  bg_disabled: { r: 0.85, g: 0.86, b: 0.89, a: 0.5 }
  check:       { r: 0.20, g: 0.55, b: 0.85, a: 1.0 }
  size: 20.0

spinbox:
  bg: { r: 0.90, g: 0.91, b: 0.94, a: 1.0 }
  height: 26.0
  btn_width: 24.0

combobox:
  bg:        { r: 0.90, g: 0.91, b: 0.94, a: 1.0 }
  popup_bg:  { r: 0.97, g: 0.97, b: 0.99, a: 0.98 }
  height: 28.0

slot:
  bg:       { r: 0.90, g: 0.91, b: 0.94, a: 0.9 }
  border:   { r: 0.75, g: 0.77, b: 0.82, a: 1.0 }
  hover:    { r: 0.55, g: 0.65, b: 0.80, a: 1.0 }
  selected: { r: 0.85, g: 0.62, b: 0.10, a: 1.0 }
  tooltip_bg:   { r: 0.85, g: 0.87, b: 0.91, a: 0.98 }
  tooltip_text: { r: 0.10, g: 0.11, b: 0.14, a: 1.0 }

metrics:
  row_height: 28.0
  row_spacing: 8.0
  label_width: 175.0
  header_height: 26.0
  card_header_height: 34.0
  scrollbar_thickness: 8.0
  scroll_frame_padding: 6.0
  button_padding_x: 16.0
  button_min_width: 80.0
