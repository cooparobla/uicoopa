format: uicoopa
scene:
  scene_name: test_window
  root_objects:

    # -----------------------------------------------------------------------
    # Canvas root — carries CanvasComponent (scale-with-screen-size, 1280x720)
    # -----------------------------------------------------------------------
    - name: Canvas
      active: true
      components:
        - !Canvas
          reference_resolution: { x: 1280.0, y: 720.0 }
          match_width_or_height: 0.5
      children:

        # Full-screen background panel
        - name: Background
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.0, y: 0.0 }
              anchor_max: { x: 1.0, y: 1.0 }
              pivot:      { x: 0.5, y: 0.5 }
              anchored_position: { x: 0.0, y: 0.0 }
              size_delta: { x: 0.0, y: 0.0 }
            - !Image
              color: { r: 0.08, g: 0.09, b: 0.12, a: 1.0 }
          children: []

        # ---- Corner-anchored panels ----

        - name: TopLeft
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.0, y: 1.0 }
              anchor_max: { x: 0.0, y: 1.0 }
              pivot:      { x: 0.0, y: 1.0 }
              anchored_position: { x: 20.0, y: -20.0 }
              size_delta: { x: 220.0, y: 90.0 }
            - !Image
              color: { r: 0.20, g: 0.55, b: 0.60, a: 0.95 }
            - !Text
              font: DejaVuSans
              text: "Top Left"
              font_size: 16
              color: { r: 0.98, g: 0.98, b: 0.98, a: 1.0 }
              horizontal_align: Center
              vertical_align: Middle
          children: []

        - name: TopRight
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 1.0, y: 1.0 }
              anchor_max: { x: 1.0, y: 1.0 }
              pivot:      { x: 1.0, y: 1.0 }
              anchored_position: { x: -20.0, y: -20.0 }
              size_delta: { x: 220.0, y: 90.0 }
            - !Image
              color: { r: 0.75, g: 0.45, b: 0.20, a: 0.95 }
            - !Text
              font: DejaVuSans
              text: "Top Right"
              font_size: 16
              color: { r: 0.98, g: 0.98, b: 0.98, a: 1.0 }
              horizontal_align: Center
              vertical_align: Middle
          children: []

        - name: BottomLeft
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.0, y: 0.0 }
              anchor_max: { x: 0.0, y: 0.0 }
              pivot:      { x: 0.0, y: 0.0 }
              anchored_position: { x: 20.0, y: 20.0 }
              size_delta: { x: 220.0, y: 90.0 }
            - !Image
              color: { r: 0.45, g: 0.25, b: 0.55, a: 0.95 }
            - !Text
              font: DejaVuSans
              text: "Bottom Left"
              font_size: 16
              color: { r: 0.98, g: 0.98, b: 0.98, a: 1.0 }
              horizontal_align: Center
              vertical_align: Middle
          children: []

        - name: BottomRight
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 1.0, y: 0.0 }
              anchor_max: { x: 1.0, y: 0.0 }
              pivot:      { x: 1.0, y: 0.0 }
              anchored_position: { x: -20.0, y: 20.0 }
              size_delta: { x: 220.0, y: 90.0 }
            - !Image
              color: { r: 0.65, g: 0.25, b: 0.40, a: 0.95 }
            - !Text
              font: DejaVuSans
              text: "Bottom Right"
              font_size: 16
              color: { r: 0.98, g: 0.98, b: 0.98, a: 1.0 }
              horizontal_align: Center
              vertical_align: Middle
          children: []

        # ---- Title + Paragraph ----

        - name: Title
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.5, y: 1.0 }
              anchor_max: { x: 0.5, y: 1.0 }
              pivot:      { x: 0.5, y: 1.0 }
              anchored_position: { x: 0.0, y: -140.0 }
              size_delta: { x: 600.0, y: 50.0 }
            - !Text
              font: DejaVuSans
              text: "uicoopa"
              font_size: 36
              color: { r: 1.0, g: 1.0, b: 1.0, a: 1.0 }
              horizontal_align: Center
              vertical_align: Middle
          children: []

        - name: Paragraph
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.5, y: 1.0 }
              anchor_max: { x: 0.5, y: 1.0 }
              pivot:      { x: 0.5, y: 1.0 }
              anchored_position: { x: 0.0, y: -200.0 }
              size_delta: { x: 460.0, y: 90.0 }
            - !Text
              font: DejaVuSans
              text: "A Unity-style RectTransform UI system: anchored panels, layout groups, buttons, and word-wrapped text, all composited on top of a Vulkan swapchain."
              font_size: 16
              color: { r: 0.85, g: 0.85, b: 0.88, a: 1.0 }
              horizontal_align: Center
              vertical_align: Top
              overflow: Wrap
          children: []

        # ---- Bottom bar with HorizontalLayoutGroup ----

        - name: Bar
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.0, y: 0.0 }
              anchor_max: { x: 1.0, y: 0.0 }
              pivot:      { x: 0.5, y: 0.0 }
              anchored_position: { x: 0.0, y: 20.0 }
              size_delta: { x: -40.0, y: 60.0 }
            - !Image
              color: { r: 0.15, g: 0.15, b: 0.18, a: 0.9 }
            - !HorizontalLayoutGroup
              spacing: 12.0
              padding:
                left:   12.0
                right:  12.0
                top:    8.0
                bottom: 8.0
              child_control_width:       true
              child_control_height:      true
              child_force_expand_width:  true
          children:
            - name: Box0
              active: true
              components:
                - !RectTransform
                  size_delta: { x: 80.0, y: 40.0 }
                - !Image
                  color: { r: 0.85, g: 0.35, b: 0.35, a: 1.0 }
              children: []

            - name: Box1
              active: true
              components:
                - !RectTransform
                  size_delta: { x: 80.0, y: 40.0 }
                - !Image
                  color: { r: 0.35, g: 0.75, b: 0.45, a: 1.0 }
              children: []

            - name: Box2
              active: true
              components:
                - !RectTransform
                  size_delta: { x: 80.0, y: 40.0 }
                - !Image
                  color: { r: 0.35, g: 0.55, b: 0.85, a: 1.0 }
              children: []

        # ---- Halo (drawn before ButtonPanel so it renders behind it) ----

        - name: HoverHalo
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.5, y: 0.5 }
              anchor_max: { x: 0.5, y: 0.5 }
              pivot:      { x: 0.5, y: 0.5 }
              anchored_position: { x: 0.0, y: 0.0 }
              size_delta: { x: 300.0, y: 110.0 }
            - !Image
              color: { r: 0.42, g: 0.70, b: 1.00, a: 0.0 }
              raycast_target: false
          children: []

        # ---- Center button ----

        - name: ButtonPanel
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.5, y: 0.5 }
              anchor_max: { x: 0.5, y: 0.5 }
              pivot:      { x: 0.5, y: 0.5 }
              anchored_position: { x: 0.0, y: 0.0 }
              size_delta: { x: 260.0, y: 70.0 }
            - !Image
              color: { r: 1.0, g: 1.0, b: 1.0, a: 1.0 }
            - !Button
            - !Text
              font: DejaVuSans
              text: "Click Me"
              font_size: 16
              color: { r: 0.92, g: 0.92, b: 0.95, a: 1.0 }
              horizontal_align: Center
              vertical_align: Middle
          children: []

        # ---- Status line readout ----

        - name: StatusLine
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.5, y: 0.5 }
              anchor_max: { x: 0.5, y: 0.5 }
              pivot:      { x: 0.5, y: 0.5 }
              anchored_position: { x: 0.0, y: -80.0 }
              size_delta: { x: 560.0, y: 28.0 }
            - !Text
              font: DejaVuSans
              text: "idle"
              font_size: 16
              color: { r: 0.75, g: 0.80, b: 0.85, a: 1.0 }
              horizontal_align: Center
              vertical_align: Middle
          children: []

        # ---- Modal dialog (last child = draws on top; starts active for start(), hidden after) ----

        - name: ModalDialog
          active: true
          components:
            - !RectTransform
              anchor_min: { x: 0.0, y: 0.0 }
              anchor_max: { x: 1.0, y: 1.0 }
              pivot:      { x: 0.5, y: 0.5 }
              anchored_position: { x: 0.0, y: 0.0 }
              size_delta: { x: 0.0, y: 0.0 }
            - !Image
              color: { r: 0.02, g: 0.02, b: 0.04, a: 0.62 }
          children:

            - name: DialogPanel
              active: true
              components:
                - !RectTransform
                  anchor_min: { x: 0.5, y: 0.5 }
                  anchor_max: { x: 0.5, y: 0.5 }
                  pivot:      { x: 0.5, y: 0.5 }
                  anchored_position: { x: 0.0, y: 0.0 }
                  size_delta: { x: 480.0, y: 260.0 }
                - !Image
                  color: { r: 0.14, g: 0.15, b: 0.20, a: 1.0 }
              children:

                - name: DialogTitle
                  active: true
                  components:
                    - !RectTransform
                      anchor_min: { x: 0.5, y: 1.0 }
                      anchor_max: { x: 0.5, y: 1.0 }
                      pivot:      { x: 0.5, y: 1.0 }
                      anchored_position: { x: 0.0, y: -34.0 }
                      size_delta: { x: 420.0, y: 44.0 }
                    - !Text
                      font: DejaVuSans
                      text: "Modal Dialog"
                      font_size: 36
                      color: { r: 1.0, g: 1.0, b: 1.0, a: 1.0 }
                      horizontal_align: Center
                      vertical_align: Middle
                  children: []

                - name: DialogBody
                  active: true
                  components:
                    - !RectTransform
                      anchor_min: { x: 0.5, y: 1.0 }
                      anchor_max: { x: 0.5, y: 1.0 }
                      pivot:      { x: 0.5, y: 1.0 }
                      anchored_position: { x: 0.0, y: -90.0 }
                      size_delta: { x: 420.0, y: 96.0 }
                    - !Text
                      font: DejaVuSans
                      text: "Opened by a Signal-driven Button::on_click slot. This panel and its Close button below are an ordinary inactive SceneObject subtree, shown and hidden with set_active()."
                      font_size: 16
                      color: { r: 0.85, g: 0.85, b: 0.88, a: 1.0 }
                      horizontal_align: Center
                      vertical_align: Top
                      overflow: Wrap
                  children: []

                - name: DialogClose
                  active: true
                  components:
                    - !RectTransform
                      anchor_min: { x: 0.5, y: 0.0 }
                      anchor_max: { x: 0.5, y: 0.0 }
                      pivot:      { x: 0.5, y: 0.0 }
                      anchored_position: { x: 0.0, y: 26.0 }
                      size_delta: { x: 160.0, y: 44.0 }
                    - !Image
                      color: { r: 1.0, g: 1.0, b: 1.0, a: 1.0 }
                    - !Button
                    - !Text
                      font: DejaVuSans
                      text: "Close"
                      font_size: 16
                      color: { r: 1.0, g: 1.0, b: 1.0, a: 1.0 }
                      horizontal_align: Center
                      vertical_align: Middle
                  children: []
